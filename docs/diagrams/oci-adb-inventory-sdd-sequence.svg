<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1180" viewBox="0 0 1650 1180">
  <defs>
    <style>
      .title{font:700 27px Arial,sans-serif;fill:#161513}.sub{font:15px Arial,sans-serif;fill:#5b5652}
      .p{font:700 13px Arial,sans-serif;fill:#161513}.msg{font:12px Arial,sans-serif;fill:#302d2a}
      .loop{font:700 12px Arial,sans-serif;fill:#5b5652}.note{font:13px Arial,sans-serif;fill:#302d2a}
      .life{stroke:#a9a19b;stroke-width:1;stroke-dasharray:6 6}.call{stroke:#c74634;stroke-width:2;fill:none}
      .search{stroke:#41729f;stroke-width:2;fill:none}.ret{stroke:#8b7e74;stroke-width:1.5;stroke-dasharray:6 4;fill:none}
    </style>
    <marker id="red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#c74634"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#41729f"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#8b7e74"/></marker>
    <marker id="green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#3f7d5a"/></marker>
  </defs>
  <rect width="1650" height="1180" fill="#fff"/>
  <text x="35" y="48" class="title">Software Design Sequence - OCI Database, Compute, and Volume Inventory</text>
  <text x="35" y="78" class="sub">Bounded read-only collection, exact attached-storage sizes, Oracle-Tags age calculation, and explicit partial errors</text>

  <g>
    <rect x="20" y="110" width="130" height="50" rx="9" fill="#e7f0f7" stroke="#41729f" stroke-width="2"/><text x="85" y="141" text-anchor="middle" class="p">Operator</text>
    <rect x="190" y="110" width="130" height="50" rx="9" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/><text x="255" y="141" text-anchor="middle" class="p">Go CLI</text>
    <rect x="360" y="110" width="130" height="50" rx="9" fill="#f9e5de" stroke="#c74634" stroke-width="2"/><text x="425" y="141" text-anchor="middle" class="p">Identity</text>
    <rect x="530" y="110" width="130" height="50" rx="9" fill="#e7f0f7" stroke="#41729f" stroke-width="2"/><text x="595" y="141" text-anchor="middle" class="p">Search</text>
    <rect x="700" y="110" width="135" height="50" rx="9" fill="#f9e5de" stroke="#c74634" stroke-width="2"/><text x="767" y="141" text-anchor="middle" class="p">Database API</text>
    <rect x="875" y="110" width="135" height="50" rx="9" fill="#f9e5de" stroke="#c74634" stroke-width="2"/><text x="942" y="141" text-anchor="middle" class="p">Compute API</text>
    <rect x="1050" y="110" width="145" height="50" rx="9" fill="#f9e5de" stroke="#c74634" stroke-width="2"/><text x="1122" y="141" text-anchor="middle" class="p">Block Volume</text>
    <rect x="1235" y="110" width="135" height="50" rx="9" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/><text x="1302" y="141" text-anchor="middle" class="p">Normalizer</text>
    <rect x="1410" y="110" width="145" height="50" rx="9" fill="#e5f2ea" stroke="#3f7d5a" stroke-width="2"/><text x="1482" y="141" text-anchor="middle" class="p">Report writer</text>
  </g>
  <g>
    <line x1="85" y1="160" x2="85" y2="1080" class="life"/><line x1="255" y1="160" x2="255" y2="1080" class="life"/>
    <line x1="425" y1="160" x2="425" y2="1080" class="life"/><line x1="595" y1="160" x2="595" y2="1080" class="life"/>
    <line x1="767" y1="160" x2="767" y2="1080" class="life"/><line x1="942" y1="160" x2="942" y2="1080" class="life"/>
    <line x1="1122" y1="160" x2="1122" y2="1080" class="life"/><line x1="1302" y1="160" x2="1302" y2="1080" class="life"/>
    <line x1="1482" y1="160" x2="1482" y2="1080" class="life"/>
  </g>

  <line x1="85" y1="200" x2="255" y2="200" class="search" marker-end="url(#blue)"/><text x="170" y="191" text-anchor="middle" class="msg">1 run(flags)</text>
  <line x1="255" y1="242" x2="425" y2="242" class="call" marker-end="url(#red)"/><text x="340" y="233" text-anchor="middle" class="msg">2 ListRegionSubscriptions</text>
  <line x1="425" y1="282" x2="255" y2="282" class="ret" marker-end="url(#gray)"/><text x="340" y="273" text-anchor="middle" class="msg">3 READY regions</text>

  <rect x="210" y="315" width="955" height="570" fill="none" stroke="#c74634" stroke-dasharray="7 6"/>
  <rect x="210" y="315" width="300" height="27" fill="#fff7f2" stroke="#c74634"/>
  <text x="225" y="334" class="loop">loop each READY region (bounded workers)</text>

  <line x1="255" y1="375" x2="595" y2="375" class="search" marker-end="url(#blue)"/><text x="425" y="366" text-anchor="middle" class="msg">4 SearchResources(two queries, all pages)</text>
  <line x1="595" y1="415" x2="255" y2="415" class="ret" marker-end="url(#gray)"/><text x="425" y="406" text-anchor="middle" class="msg">5 Autonomous DB + instance OCIDs</text>

  <rect x="225" y="445" width="575" height="115" fill="#fff" fill-opacity=".7" stroke="#41729f" stroke-dasharray="6 5"/>
  <text x="240" y="465" class="loop">loop Autonomous Database OCIDs</text>
  <line x1="255" y1="493" x2="767" y2="493" class="call" marker-end="url(#red)"/><text x="511" y="484" text-anchor="middle" class="msg">6 GetAutonomousDatabase</text>
  <line x1="767" y1="535" x2="255" y2="535" class="ret" marker-end="url(#gray)"/><text x="511" y="526" text-anchor="middle" class="msg">7 complete AutonomousDatabase object</text>

  <rect x="225" y="580" width="915" height="285" fill="#fff" fill-opacity=".7" stroke="#c74634" stroke-dasharray="6 5"/>
  <text x="240" y="600" class="loop">loop Compute instance OCIDs</text>
  <line x1="255" y1="628" x2="942" y2="628" class="call" marker-end="url(#red)"/><text x="598" y="619" text-anchor="middle" class="msg">8 GetInstance</text>
  <line x1="942" y1="665" x2="255" y2="665" class="ret" marker-end="url(#gray)"/><text x="598" y="656" text-anchor="middle" class="msg">9 complete Instance + Oracle-Tags</text>
  <line x1="255" y1="707" x2="942" y2="707" class="call" marker-end="url(#red)"/><text x="598" y="698" text-anchor="middle" class="msg">10 ListBootVolumeAttachments + ListVolumeAttachments</text>
  <line x1="942" y1="744" x2="255" y2="744" class="ret" marker-end="url(#gray)"/><text x="598" y="735" text-anchor="middle" class="msg">11 ATTACHED volume OCIDs + attachment objects</text>
  <line x1="255" y1="787" x2="1122" y2="787" class="call" marker-end="url(#red)"/><text x="688" y="778" text-anchor="middle" class="msg">12 GetBootVolume / GetVolume</text>
  <line x1="1122" y1="824" x2="255" y2="824" class="ret" marker-end="url(#gray)"/><text x="688" y="815" text-anchor="middle" class="msg">13 exact sizeInGBs + complete volume object</text>
  <text x="688" y="851" text-anchor="middle" class="msg" fill="#8b6b16">On detail failure: retain attachment, size unknown, total incomplete</text>

  <line x1="255" y1="925" x2="1302" y2="925" class="search" marker-end="url(#blue)"/><text x="778" y="916" text-anchor="middle" class="msg">14 normalize CPU/storage; calculate OCI + tag age days at generated_at</text>
  <line x1="1302" y1="968" x2="255" y2="968" class="ret" marker-end="url(#gray)"/><text x="778" y="959" text-anchor="middle" class="msg">15 schema v2.3 records + structured OCI errors</text>
  <line x1="255" y1="1012" x2="1482" y2="1012" stroke="#3f7d5a" stroke-width="2" marker-end="url(#green)"/><text x="868" y="1003" text-anchor="middle" class="msg">16 write combined JSON + five CSV files + Markdown</text>
  <line x1="1482" y1="1055" x2="85" y2="1055" stroke="#3f7d5a" stroke-width="2" marker-end="url(#green)"/><text x="783" y="1046" text-anchor="middle" class="msg">17 atomic report paths + counts + strict-mode status</text>

  <rect x="395" y="1100" width="850" height="60" rx="8" fill="#fff8df" stroke="#d6b656"/>
  <text x="415" y="1124" class="p">Partial failure contract</text>
  <text x="415" y="1147" class="note">Independent errors stay in the report. Volume-detail failures cannot silently understate a total. Strict mode writes partial output before returning non-zero.</text>
</svg>
