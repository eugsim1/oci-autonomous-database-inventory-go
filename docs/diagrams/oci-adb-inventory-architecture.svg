  <rect width="1600" height="1000" fill="#fff"/>
  <text x="48" y="53" class="title">OCI Autonomous Database + Compute Inventory</text>
  <text x="48" y="83" class="sub">Read-only, tenancy-wide, multi-region discovery with authoritative Database, Compute, and Block Volume enrichment</text>

  <rect x="45" y="145" width="205" height="105" rx="12" fill="#e7f0f7" stroke="#41729f" stroke-width="2"/>
  <text x="147" y="180" text-anchor="middle" class="h">Operator / Scheduler</text>
  <text x="147" y="207" text-anchor="middle" class="t">CLI, cron, CI</text>
  <text x="147" y="229" text-anchor="middle" class="t">or OCI runtime</text>

  <rect x="295" y="132" width="220" height="132" rx="12" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/>
  <text x="405" y="165" text-anchor="middle" class="h">OCI SDK authentication</text>
  <text x="405" y="191" text-anchor="middle" class="t">API signing key</text>
  <text x="405" y="213" text-anchor="middle" class="t">Instance principal</text>
  <text x="405" y="235" text-anchor="middle" class="t">Resource principal</text>

  <rect x="565" y="108" width="990" height="682" rx="14" fill="#fff7f2" stroke="#c74634" stroke-width="3"/>
  <rect x="565" y="108" width="990" height="42" rx="14" fill="#f9e5de"/>
  <text x="590" y="136" class="h" fill="#c74634">OCI TENANCY</text>

  <rect x="615" y="174" width="205" height="88" rx="10" fill="#f9e5de" stroke="#c74634" stroke-width="2"/>
  <text x="717" y="207" text-anchor="middle" class="h">Identity</text>
  <text x="717" y="233" text-anchor="middle" class="t">ListRegionSubscriptions</text>
  <rect x="875" y="174" width="235" height="88" rx="10" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/>
  <text x="992" y="207" text-anchor="middle" class="h">READY-region workers</text>
  <text x="992" y="233" text-anchor="middle" class="t">Bounded concurrency + retries</text>
  <rect x="1165" y="160" width="340" height="116" rx="10" fill="#e7f0f7" stroke="#41729f" stroke-width="2"/>
  <text x="1335" y="191" text-anchor="middle" class="h">OCI Resource Search</text>
  <text x="1335" y="216" text-anchor="middle" class="t">query autonomousdatabase resources</text>
  <text x="1335" y="238" text-anchor="middle" class="t">query instance resources</text>
  <text x="1335" y="260" text-anchor="middle" class="small">full pagination in every READY region</text>

  <rect x="615" y="315" width="890" height="160" rx="10" fill="#fff" stroke="#d6cfc8" stroke-width="2" stroke-dasharray="7 6"/>
