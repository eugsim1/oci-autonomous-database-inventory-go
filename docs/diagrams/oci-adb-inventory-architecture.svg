  <rect x="665" y="365" width="235" height="82" rx="10" fill="#f9e5de" stroke="#c74634" stroke-width="2"/>
  <text x="782" y="397" text-anchor="middle" class="h">Database Service API</text>
  <text x="782" y="423" text-anchor="middle" class="t">GetAutonomousDatabase</text>
  <rect x="990" y="352" width="235" height="108" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/>
  <text x="1107" y="384" text-anchor="middle" class="h">Autonomous Database</text>
  <text x="1107" y="408" text-anchor="middle" class="t">Complete SDK object</text>
  <text x="1107" y="430" text-anchor="middle" class="t">ECPU / OCPU | GB / TB</text>
  <rect x="1300" y="357" width="170" height="98" rx="10" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/>
  <text x="1385" y="389" text-anchor="middle" class="h">DB summary</text>
  <text x="1385" y="414" text-anchor="middle" class="t">Compute + storage</text>
  <text x="1385" y="436" text-anchor="middle" class="t">State + network</text>

  <rect x="615" y="505" width="890" height="225" rx="10" fill="#fff" stroke="#d6cfc8" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="638" y="532" class="lane">COMPUTE + ATTACHED STORAGE PATH</text>
  <rect x="645" y="565" width="220" height="118" rx="10" fill="#f9e5de" stroke="#c74634" stroke-width="2"/>
  <text x="755" y="595" text-anchor="middle" class="h">Compute API</text>
  <text x="755" y="619" text-anchor="middle" class="t">GetInstance</text>
  <text x="755" y="641" text-anchor="middle" class="t">List boot attachments</text>
  <text x="755" y="663" text-anchor="middle" class="t">List block attachments</text>
  <rect x="905" y="555" width="225" height="138" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/>
  <text x="1017" y="587" text-anchor="middle" class="h">Compute instance</text>
  <text x="1017" y="613" text-anchor="middle" class="t">Shape / OCPU / memory</text>
  <text x="1017" y="635" text-anchor="middle" class="t">Oracle-Tags.CreatedOn</text>
  <text x="1017" y="657" text-anchor="middle" class="t">CreatedBy + age days</text>
  <text x="1017" y="679" text-anchor="middle" class="small">ATTACHED volumes only</text>
  <rect x="1165" y="570" width="175" height="108" rx="10" fill="#f9e5de" stroke="#c74634" stroke-width="2"/>
  <text x="1252" y="602" text-anchor="middle" class="h">Block Volume API</text>
  <text x="1252" y="630" text-anchor="middle" class="t">GetBootVolume</text>
  <text x="1252" y="653" text-anchor="middle" class="t">GetVolume</text>
  <ellipse cx="1420" cy="574" rx="61" ry="16" fill="#e7f0f7" stroke="#41729f" stroke-width="2"/>
  <path d="M1359 574v101c0 9 27 16 61 16s61-7 61-16V574" fill="#e7f0f7" stroke="#41729f" stroke-width="2"/>
  <ellipse cx="1420" cy="675" rx="61" ry="16" fill="#d9e9f4" stroke="#41729f" stroke-width="2"/>
  <text x="1420" y="609" text-anchor="middle" class="h">Attached</text>
  <text x="1420" y="630" text-anchor="middle" class="h">volumes</text>
  <text x="1420" y="652" text-anchor="middle" class="small">exact sizeInGBs</text>

  <rect x="295" y="355" width="265" height="158" rx="12" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/>
  <text x="427" y="388" text-anchor="middle" class="h">Collector + normalizer</text>
  <text x="427" y="415" text-anchor="middle" class="t">Complete SDK objects</text>
  <text x="427" y="438" text-anchor="middle" class="t">Exact sizes and totals</text>
  <text x="427" y="461" text-anchor="middle" class="t">Oracle-Tags age calculation</text>
  <text x="427" y="484" text-anchor="middle" class="t">Explicit partial errors</text>
  <rect x="295" y="570" width="265" height="130" rx="12" fill="#f4f1ed" stroke="#8b7e74" stroke-width="2"/>
  <text x="427" y="604" text-anchor="middle" class="h">Atomic report writer</text>
  <text x="427" y="631" text-anchor="middle" class="t">Shared UTC timestamp</text>
  <text x="427" y="654" text-anchor="middle" class="t">Restricted permissions</text>
  <text x="427" y="677" text-anchor="middle" class="t">Temporary file + rename</text>
  <rect x="45" y="565" width="205" height="145" rx="12" fill="#e5f2ea" stroke="#3f7d5a" stroke-width="2"/>
  <text x="147" y="598" text-anchor="middle" class="h">Timestamped reports</text>
  <text x="147" y="625" text-anchor="middle" class="t">Combined JSON</text>
  <text x="147" y="647" text-anchor="middle" class="t">Autonomous DB CSV</text>
  <text x="147" y="669" text-anchor="middle" class="t">Compute + volume CSV</text>
  <text x="147" y="691" text-anchor="middle" class="t">Markdown summary</text>

