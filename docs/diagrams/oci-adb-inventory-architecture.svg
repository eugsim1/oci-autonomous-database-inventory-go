<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#161513}.sub{font:15px Arial,sans-serif;fill:#5b5652}
      .h{font:700 15px Arial,sans-serif;fill:#161513}.t{font:13px Arial,sans-serif;fill:#302d2a}
      .lane{font:700 13px Arial,sans-serif;fill:#5b5652;letter-spacing:.5px}
      .small{font:12px Arial,sans-serif;fill:#5b5652}.edge{fill:none;stroke-width:2.2}
    </style>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#41729f"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c74634"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b7e74"/></marker>
